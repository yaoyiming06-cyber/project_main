# Apple Silicon MPS starting profile. Training settings keep the same model,
# labels, optimizer, schedule, and augmentation as the CUDA G1 baseline.
run_name: G1_seed42_convnext_base_in22k_mac
seed: 42
model: convnext_base.fb_in22k
pretrained: true
pretrained_checkpoint: weights/convnext_base.fb_in22k.safetensors

input_size: 224
epochs: 10
warmup_epochs: 5
batch_size_studies: 1
accum_steps: 16
lr: 0.001
min_lr: 0.000001
weight_decay: 0.05
layer_decay: 0.75
drop_path: 0.1
clip_grad: null

optimizer: adamw
num_workers: 0
pin_memory: false
amp: false
gradient_checkpointing: true
image_chunk_size: 1

label_strategy: E0
blank_policy: zero
uncertain_policy: ignore
pos_weight_mode: ratio
manual_pos_weights: null
loss: bce
focal_gamma: 2.0
max_pos_weight: 20.0
hard_label_indices: [0, 3, 7]
expert_loss_weight: 0.5

augmentation: G1
augmentation_translate: 0.02
augmentation_scale: [0.98, 1.02]
augmentation_degrees: 3
color_jitter_brightness: 0.08
color_jitter_contrast: 0.08
horizontal_flip: false
normalization: imagenet1k

image_root: ../cxr_first
train_manifest: data/manifests/train_manifest.csv
valid_manifest: data/manifests/valid_manifest.csv
test_manifest: data/manifests/test_manifest.csv
output_dir: runs/G1_seed42_convnext_base_in22k_mac
